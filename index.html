{

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useMemo, useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import clsx from 'clsx';
        import * as XLSX from 'xlsx';
        import { format, differenceInCalendarDays, startOfDay, getWeek, getMonth, isValid, parse } from 'date-fns';
        import fr from 'date-fns/locale/fr';
        import * as htmlToImage from 'html-to-image';
        import { 
            LayoutDashboard, LayoutGrid, CheckCircle2, ShieldCheck, BarChart3, BarChart2, PhoneIncoming, 
            Upload, FileUp, FileSpreadsheet, RefreshCw, Loader2, AlertTriangle, 
            Database, Download, X, Check, HelpCircle, Monitor, Clipboard, Eye,
            FileWarning, Users, CheckCircle, RotateCcw, Bug, Wrench, 
            Camera, ClipboardCheck, TrendingUp, UploadCloud, Phone
        } from 'lucide-react';

        // --- CONSTANTS ---

        const EXPORT_COLUMNS_ORDER = [
            'TYPE', 'STATUT VALIDATION', 'CONTACT', 'CHGT PRESTA', 'VALIDATION ROP', 'CHGT DESSERTE', 
            'DÉCHETS PM', 'CADRAGE PM', 'RÉF JARR.', 'MESURE PM', 'PTO CONFORME', 'ÉTIQUETTE PTO', 
            'SUSPICION FRAUDE', 'MESURE PTO AVANT', 'MESURE PTO', 'PHOTO PTO', 'CADRAGE PTO', 
            'RÉF CABLE', 'RÉF PB', 'PHOTO PBO AVANT', 'PHOTO PBO APRÈS', 'CADRAGE PB', 'MESURE E2', 
            'PÉNÉTRATION', 'GÉOLOCALISATION', 'CHECKVOISINAGE', 'VOISIN PERTURBÉ', 'INC', 'NACELLE', 'POTEAU'
        ];

        const DEPARTMENT_TO_AGENCY = {
            '1': 'CTA', '01': 'CTA', '2': 'INE', '02': 'INE', '4': 'PACA', '04': 'PACA',
            '5': 'PACA', '05': 'PACA', '6': 'PACA', '06': 'PACA', '7': 'CTA', '07': 'CTA',
            '8': 'INE', '08': 'INE', '10': 'INE', '13': 'PACA', 
            '16': 'SO',
            '18': 'INE', '20': 'Corse', '2A': 'Corse', '2B': 'Corse', '21': 'CTA',
            '30': 'SO', '31': 'SO', '32': 'SO', '33': 'SO', '34': 'SO',
            '38': 'CTA', '39': 'CTA', '45': 'INE', 
            '46': 'SO', '47': 'SO',
            '51': 'INE', '52': 'INE', '54': 'INE', '55': 'INE', '57': 'INE', '58': 'CTA',
            '59': 'INE', '60': 'INE', '69': 'CTA', '71': 'CTA', '73': 'CTA', '74': 'CTA',
            '77': 'INE', 
            '81': 'SO', '82': 'SO',
            '83': 'PACA', 
            '87': 'SO',
            '88': 'INE', '89': 'INE', '93': 'INE', '94': 'INE',
        };

        const COLUMN_MATCHERS = {
            id: ['id', 'reference', 'ref', 'number', 'numero'],
            date: ['debut inter', 'u_datedebutinter', 'date_debut', 'planifie'], 
            department: ['departement', 'dept', 'cp', 'zip', 'code_postal', 'u_dpt'],
            technician: ['technicien', 'u_technicien'], 
            comments: ['commentaire 2', 'u_commentaire_2', 'comments', 'resume'],
            validator: ['closed by', 'ferme par', 'u_closed_by', 'cloture par', 'validateur'],
            installTypeCA: ['type d\'installation validé par la ca', 'type d\'installation valide', 'type installation valide', 'type valide par la ca', 'u_type_install_valide']
        };

        const AGENCY_COLORS = {
            'CTA': '#2563eb', // blue-600
            'INE': '#9333ea', // purple-600
            'PACA': '#f97316', // orange-500
            'SO': '#0891b2', // cyan-600
            'CORSE': '#dc2626', // red-600
            'DEFAULT': '#374151' // slate-700
        };

        const getAgencyColor = (agency) => {
            return AGENCY_COLORS[agency?.toUpperCase()] || AGENCY_COLORS.DEFAULT;
        };

        // --- UTILS : EXCEL PARSER ---

        const parseFile = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = e.target?.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        resolve(jsonData);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = (error) => reject(error);
                reader.readAsBinaryString(file);
            });
        };

        // --- UTILS : DATA PROCESSING & HELPERS ---

        const getHeatmapHex = (ratio) => {
            const rSafe = Math.max(0, Math.min(1, ratio));
            const start = { r: 255, g: 255, b: 255 };
            const end = { r: 239, g: 68, b: 68 };
            const r = Math.round(start.r + (end.r - start.r) * rSafe);
            const g = Math.round(start.g + (end.g - start.g) * rSafe);
            const b = Math.round(start.b + (end.b - start.b) * rSafe);
            return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
        };

        const formatSeconds = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return [h, m, s].map(v => v.toString().padStart(2, '0')).join(':');
        };

        const getPeriodLabel = (data) => {
            if (!data || !data.length) return "Période Inconnue";

            // Extract unique dates (ignoring time)
            const dates = Array.from(new Set(data.map(d => startOfDay(d.date).getTime()))).sort();
            
            if (dates.length === 1) {
                const date = new Date(dates[0]);
                const today = startOfDay(new Date());
                const diff = differenceInCalendarDays(today, date);
                if (diff === 1) return "J-1";
                return format(date, "dd/MM", { locale: fr });
            }

            // Check if multiple dates are within the same week
            const weeks = new Set(data.map(d => d.week));
            if (weeks.size === 1) {
                return `S-${Array.from(weeks)[0]}`;
            }

            // Fallback to Month Name if multiple weeks
            const months = new Set(data.map(d => d.month));
            if (months.size === 1) {
                return format(new Date(dates[0]), "MMMM", { locale: fr });
            }

            return "Période Multiple";
        };

        const normalizeStr = (str) => 
            str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim() : "";

        const findKey = (row, matchers) => {
            const keys = Object.keys(row);
            return keys.find(key => {
                const kLow = key.toLowerCase();
                const kNorm = normalizeStr(key);
                return matchers.some(m => {
                    const mLow = m.toLowerCase();
                    const mNorm = normalizeStr(m);
                    return kLow.includes(mLow) || kNorm.includes(mNorm);
                });
            });
        };

        const CALL_MATCHERS = {
            queueName: ['nom de la file', 'nom file', 'queue name'],
            offered: ['offre', 'appels recus', 'reçus', 'recus', 'presentes'],
            answered: ['reponse', 'réponse', 'rÃ©ponse', 'appels traites', 'traités', 'traites', 'servis'],
            abandoned: ['abandon', 'perdus'],
            short: ['abandons courts', 'court', '< 10', 'dissuade'],
            dmr: ['asa', 'vitesse', 'dmr', 'temps de reponse'],
            dmt: ['moy. traitement', 'dmt', 'duree moy'],
            mea: ['temps moyen de mise en attente', 'mise en attente', 'mea']
        };

        const parseFlexibleDuration = (val) => {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') {
                if (val < 100) return Math.round(val * 86400); 
                if (val > 5000) return Math.round(val / 1000); 
                return Math.round(val);
            }
            const strVal = String(val).trim();
            if (strVal === '-' || strVal === '') return 0;
            if (/[hms]/.test(strVal) && !/:/.test(strVal)) {
                let totalSeconds = 0;
                const h = strVal.match(/(\d+)\s*h/i);
                const m = strVal.match(/(\d+)\s*m/i);
                const s = strVal.match(/(\d+)\s*s/i);
                if (h) totalSeconds += parseInt(h[1]) * 3600;
                if (m) totalSeconds += parseInt(m[1]) * 60;
                if (s) totalSeconds += parseInt(s[1]);
                return totalSeconds;
            }
            if (strVal.includes(':')) {
                const parts = strVal.split(':').map(p => parseFloat(p));
                if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
                if (parts.length === 2) return (parts[0] * 60) + parts[1];
            }
            const floatVal = parseFloat(strVal.replace(',', '.'));
            if (!isNaN(floatVal)) {
                if (floatVal < 1) return Math.round(floatVal * 86400);
                return Math.round(floatVal);
            }
            return 0;
        };

        const parseFlexibleNumber = (val, isRatio = false) => {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') {
                if (isRatio && val <= 1 && val > 0) return val * 100; 
                return val;
            }
            let strVal = String(val).replace(',', '.').replace('%', '').trim();
            if (strVal === '-') return 0;
            const floatVal = parseFloat(strVal);
            if (isNaN(floatVal)) return 0;
            if (isRatio && floatVal <= 1 && floatVal > 0 && !String(val).includes('%')) {
                return floatVal * 100;
            }
            return floatVal;
        };

        const parseCommentData = (raw) => {
            if (!raw) return {};
            const match = raw.match(/\[\[([\s\S]*?)\]\]/);
            if (!match) return {}; 
            const content = match[1];
            // Split by single backslash (escaped in JS string as \\)
            const values = content.split('\\');
            const data = {};
            EXPORT_COLUMNS_ORDER.forEach((header, index) => {
                data[header] = values[index] !== undefined ? values[index].trim() : 'NA';
            });
            return data;
        };

        const identifyNCReason = (parsedData, isCorrectionContext = false) => {
            const IGNORED_COLS = ['TYPE', 'STATUT VALIDATION', 'CONTACT', 'CHGT PRESTA', 'VALIDATION ROP', 'CHGT DESSERTE'];
            const OK_VALUES = ['1', 'OK', 'NA', 'RAS', 'CONFORME', 'YES', 'OUI', '', '-', 'N/A', '0 (RAS)', '1 (RAS)', '2'];
            const formatReason = (key, val) => {
                const reasonMatch = val.match(/\((.*?)\)/);
                if (reasonMatch && reasonMatch[1] && reasonMatch[1].trim().length > 0) {
                    const comment = reasonMatch[1].trim();
                    if (['RAS', 'OK', 'CONFORME', 'NA'].includes(comment.toUpperCase())) return key;
                    return `${key} (${comment})`;
                }
                return key;
            };
            for (const [key, val] of Object.entries(parsedData)) {
                if (IGNORED_COLS.includes(key)) continue;
                const vUpper = val.toUpperCase().trim();
                if (vUpper.startsWith('COR') || vUpper.startsWith('0') || vUpper === 'NC' || vUpper === 'KO') {
                    return formatReason(key, val);
                }
            }
            if (isCorrectionContext) {
                for (const [key, val] of Object.entries(parsedData)) {
                    if (IGNORED_COLS.includes(key)) continue;
                    const vClean = val.trim();
                    const vUpper = vClean.toUpperCase();
                    if (vClean.length > 0 && !OK_VALUES.includes(vUpper)) return formatReason(key, val);
                }
            }
            if (parsedData['SUSPICION FRAUDE'] && !OK_VALUES.includes(parsedData['SUSPICION FRAUDE'].toUpperCase())) return 'SUSPICION FRAUDE';
            if (parsedData['RACC SAUVAGE'] && !OK_VALUES.includes(parsedData['RACC SAUVAGE'].toUpperCase())) return 'RACC SAUVAGE';
            return undefined;
        };

        const normalizeData = (rawData) => {
            if (rawData.length === 0) return [];
            const firstRow = rawData[0];
            const map = {
                id: findKey(firstRow, COLUMN_MATCHERS.id),
                date: findKey(firstRow, COLUMN_MATCHERS.date),
                dept: findKey(firstRow, COLUMN_MATCHERS.department),
                tech: findKey(firstRow, COLUMN_MATCHERS.technician),
                comments: findKey(firstRow, COLUMN_MATCHERS.comments),
                validator: findKey(firstRow, COLUMN_MATCHERS.validator),
                installTypeCA: findKey(firstRow, COLUMN_MATCHERS.installTypeCA),
            };

            return rawData.map((row, index) => {
                const id = map.id ? String(row[map.id]) : `ROW-${index}`;
                let date = new Date();
                const dateVal = map.date ? row[map.date] : null;
                if (dateVal) {
                    if (typeof dateVal === 'number') {
                        date = new Date((dateVal - (25567 + 2)) * 86400 * 1000);
                    } else if (typeof dateVal === 'string') {
                        let cleanDate = dateVal.trim();
                        const d1 = parse(cleanDate, 'dd/MM/yyyy HH:mm:ss', new Date());
                        const d2 = parse(cleanDate, 'dd/MM/yyyy', new Date());
                        const d3 = parse(cleanDate, 'yyyy-MM-dd', new Date());
                        if (isValid(d1)) date = d1;
                        else if (isValid(d2)) date = d2;
                        else if (isValid(d3)) date = d3;
                        else {
                            const d4 = new Date(cleanDate);
                            if (isValid(d4)) date = d4;
                        }
                    }
                }

                let dept = map.dept ? String(row[map.dept]).trim() : '99';
                const deptMatch = dept.match(/(\d+)/);
                if (deptMatch) dept = deptMatch[0];
                let agency = 'Unknown';
                const padDept = dept.padStart(2, '0');
                const unpadDept = String(parseInt(dept, 10));
                if (DEPARTMENT_TO_AGENCY[dept]) agency = DEPARTMENT_TO_AGENCY[dept];
                else if (DEPARTMENT_TO_AGENCY[padDept]) agency = DEPARTMENT_TO_AGENCY[padDept];
                else if (DEPARTMENT_TO_AGENCY[unpadDept]) agency = DEPARTMENT_TO_AGENCY[unpadDept];

                const technician = map.tech ? String(row[map.tech]).trim() : 'Unknown';
                const validator = map.validator ? String(row[map.validator]).trim() : 'System';
                const rawComment = map.comments ? String(row[map.comments]).trim() : '';
                
                let ignoreReason = 'VALID';
                let parsedData = {};

                if (rawComment === '') ignoreReason = 'EMPTY';
                else if (rawComment.includes('[[')) {
                    parsedData = parseCommentData(rawComment);
                    if (rawComment.startsWith('[[')) {
                        if (Object.keys(parsedData).length === 0) ignoreReason = 'TAG_ABSENT';
                        else ignoreReason = 'VALID';
                    } else ignoreReason = 'TAG_MISPLACED';
                } else ignoreReason = 'TAG_ABSENT';

                const isIgnored = ignoreReason !== 'VALID';
                let installType = 'Inconnu';
                if (map.installTypeCA && row[map.installTypeCA]) {
                    const caValue = String(row[map.installTypeCA]).trim();
                    if (caValue.length > 0) installType = caValue;
                }
                if (installType === 'Inconnu' && parsedData['TYPE'] && parsedData['TYPE'] !== 'NA') installType = parsedData['TYPE'];

                let contactStatus = 'Avec Contact';
                const contactVal = parsedData['CONTACT'] ? parsedData['CONTACT'].toUpperCase() : '';
                if (contactVal.includes('NON') || contactVal.includes('SANS') || contactVal === '0') contactStatus = 'Sans Contact';

                const validationStatus = parsedData['STATUT VALIDATION'] ? parsedData['STATUT VALIDATION'].toUpperCase() : 'INCONNU';
                let status = 'INCONNU';
                if (validationStatus.includes('CONF')) status = 'OK';
                else if (validationStatus.includes('COR')) status = 'OK';
                else if (validationStatus.includes('NC') || validationStatus.includes('KO')) status = 'NC';

                let ncReason = undefined;
                if (status === 'NC' || validationStatus.includes('COR')) ncReason = identifyNCReason(parsedData, validationStatus.includes('COR'));

                const extractedFields = {};
                EXPORT_COLUMNS_ORDER.forEach(col => { extractedFields[col] = parsedData[col] || ''; });

                return {
                    id, date, week: getWeek(date, { weekStartsOn: 1 }), month: getMonth(date) + 1,
                    department: dept, agency, technician, validator, status, validationStatus,
                    installType, contactStatus, ncReason, isIgnored, ignoreReason, originalRow: row, extractedFields
                };
            }).filter(i => i.agency !== 'Unknown' || i.validator !== 'System');
        };

        const normalizeCallData = (rawData, selectedAgency = 'INE') => {
            if (rawData.length === 0) return [];
            const firstRow = rawData[0];
            const colQueue = findKey(firstRow, CALL_MATCHERS.queueName);
            const colOffre = findKey(firstRow, CALL_MATCHERS.offered);
            const colReponse = findKey(firstRow, CALL_MATCHERS.answered);
            const colAbandon = findKey(firstRow, CALL_MATCHERS.abandoned);
            const colCourt = findKey(firstRow, CALL_MATCHERS.short);
            const colDmr = findKey(firstRow, CALL_MATCHERS.dmr);
            const colDmt = findKey(firstRow, CALL_MATCHERS.dmt);
            const colMea = findKey(firstRow, CALL_MATCHERS.mea);

            let totalOffered = 0, totalAnswered = 0, totalAbandon = 0, totalShort = 0;
            let totalDmrWeighted = 0, totalDmtWeighted = 0, totalMeaWeighted = 0, countRows = 0;
            const selectedAgencyUpper = selectedAgency.toUpperCase();

            rawData.forEach(row => {
                if (colQueue && selectedAgency) {
                    const queueName = String(row[colQueue]).toUpperCase();
                    let isAgencyMatch = false;
                    if (selectedAgencyUpper === 'PACA' || selectedAgencyUpper === 'CORSE') {
                        if (queueName.includes('PACA') || queueName.includes('CORSE')) isAgencyMatch = true;
                    } else if (selectedAgencyUpper === 'SO') {
                        // Accept both SO and MED for SO agency
                        if (queueName.includes('SO') || queueName.includes('MED')) isAgencyMatch = true;
                    } else {
                        if (queueName.includes(selectedAgencyUpper)) isAgencyMatch = true;
                    }
                    if (!isAgencyMatch) return;
                }
                const off = parseFlexibleNumber(row[colOffre]);
                const ans = parseFlexibleNumber(row[colReponse]);
                const abd = parseFlexibleNumber(row[colAbandon]);
                const sh = parseFlexibleNumber(row[colCourt]);
                const dmr = parseFlexibleDuration(row[colDmr]);
                const dmt = parseFlexibleDuration(row[colDmt]);
                const mea = parseFlexibleDuration(row[colMea]);

                totalOffered += off; totalAnswered += ans; totalAbandon += abd; totalShort += sh;
                const weight = ans > 0 ? ans : (off > 0 ? off : 1);
                totalDmrWeighted += dmr * weight; totalDmtWeighted += dmt * weight; totalMeaWeighted += mea * weight;
                countRows++;
            });

            if (totalOffered === 0 && countRows === 0) return [];
            const qs = totalOffered > 0 ? (totalAnswered / totalOffered) * 100 : 0;
            const validOffered = Math.max(0, totalOffered - totalShort);
            const qsNet = validOffered > 0 ? (totalAnswered / validOffered) * 100 : 0;
            const totalWeight = totalAnswered > 0 ? totalAnswered : (totalOffered > 0 ? totalOffered : countRows);
            
            return [{
                agency: selectedAgency, offered: totalOffered, answered: totalAnswered,
                abandoned: totalAbandon, shortAbandoned: totalShort, qs, qsNet,
                dmr: totalWeight > 0 ? totalDmrWeighted / totalWeight : 0,
                dmt: totalWeight > 0 ? totalDmtWeighted / totalWeight : 0,
                mea: totalWeight > 0 ? totalMeaWeighted / totalWeight : 0,
            }];
        };

        const getCallFileDebugInfo = (rawData, selectedAgency) => {
            if (!rawData || rawData.length === 0) return { error: "Fichier vide" };
            const firstRow = rawData[0];
            const columnsFound = {};
            const columnsMissing = [];
            Object.entries(CALL_MATCHERS).forEach(([key, matchers]) => {
                const found = findKey(firstRow, matchers);
                if (found) columnsFound[key] = found; else columnsMissing.push(key);
            });
            const colQueue = columnsFound.queueName;
            let matchingRows = 0, agencyMismatchCount = 0;
            const firstFiveRows = rawData.slice(0, 5).map(r => ({
                queue: colQueue ? r[colQueue] : 'N/A', offered: columnsFound.offered ? r[columnsFound.offered] : 'N/A', matched: false, reason: ''
            }));
            const selectedAgencyUpper = selectedAgency.toUpperCase();
            rawData.forEach((row, idx) => {
                let isAgencyMatch = true;
                if (colQueue && selectedAgency) {
                    const q = String(row[colQueue]).toUpperCase();
                    let strictMatch = false;
                    if (selectedAgencyUpper === 'PACA' || selectedAgencyUpper === 'CORSE') {
                        if (q.includes('PACA') || q.includes('CORSE')) strictMatch = true;
                    } else if (selectedAgencyUpper === 'SO') {
                        if (q.includes('SO') || q.includes('MED')) strictMatch = true;
                    } else {
                        if (q.includes(selectedAgencyUpper)) strictMatch = true;
                    }
                    if (!strictMatch) isAgencyMatch = false;
                }
                if (!isAgencyMatch) agencyMismatchCount++;
                if (isAgencyMatch) matchingRows++;
                if (idx < 5) {
                    firstFiveRows[idx].matched = isAgencyMatch;
                    if (!isAgencyMatch) firstFiveRows[idx].reason = `Agence '${row[colQueue]}' != '${selectedAgency}' (PACA/CORSE/SO handled)`;
                    else firstFiveRows[idx].reason = 'OK';
                }
            });
            return { totalRows: rawData.length, headers: Object.keys(firstRow), columnsFound, columnsMissing, selectedAgency, matchingRows, agencyMismatchCount, sampleData: firstFiveRows };
        };

        const calculateGlobalValidatorStats = (data) => {
            const map = new Map();
            const typesSet = new Set();
            data.forEach(item => {
                if (!map.has(item.validator)) map.set(item.validator, { validator: item.validator, totalCases: 0, withContact: 0, withoutContact: 0, typesBreakdown: {} });
                const stat = map.get(item.validator);
                stat.totalCases++;
                if (item.contactStatus === 'Avec Contact') stat.withContact++; else stat.withoutContact++;
                let type = 'Non Tagué';
                if (item.extractedFields && item.extractedFields['TYPE'] && item.extractedFields['TYPE'] !== 'NA' && item.extractedFields['TYPE'] !== '') type = item.extractedFields['TYPE'];
                if (!stat.typesBreakdown[type]) stat.typesBreakdown[type] = 0;
                stat.typesBreakdown[type]++;
                typesSet.add(type);
            });
            return { stats: Array.from(map.values()).sort((a, b) => b.totalCases - a.totalCases), allTypes: Array.from(typesSet).sort() };
        };

        const calculateGlobalIgnoredStats = (data) => {
            const map = new Map();
            data.forEach(item => {
                if (item.isIgnored) {
                    if (!map.has(item.validator)) map.set(item.validator, { validator: item.validator, tagAbsent: 0, tagMisplaced: 0, emptyLine: 0, total: 0 });
                    const stat = map.get(item.validator);
                    stat.total++;
                    if (item.ignoreReason === 'EMPTY') stat.emptyLine++;
                    else if (item.ignoreReason === 'TAG_ABSENT') stat.tagAbsent++;
                    else if (item.ignoreReason === 'TAG_MISPLACED') stat.tagMisplaced++;
                }
            });
            return Array.from(map.values()).sort((a, b) => b.total - a.total);
        };

        // NEW: Calculate Top 5 NC Tags
        const calculateGlobalTagNCs = (data, selectedAgency) => {
            const map = new Map();
            const EXCEPTION_TAGS = ['INC', 'VOISIN PERTURBÉ', 'VOISIN PERTURBE']; 
            
            data.forEach(item => {
                if (item.isIgnored) return;
                if (selectedAgency && item.agency !== selectedAgency) return;
                Object.entries(item.extractedFields).forEach(([tagName, val]) => {
                    const upperVal = val.trim().toUpperCase();
                    if (!upperVal || upperVal === 'NA' || upperVal === '-') return;
                    let isNC = false;
                    let comment = '';
                    if (EXCEPTION_TAGS.includes(tagName)) {
                        if (['OUI', 'YES', '1'].includes(upperVal)) {
                            isNC = true;
                            const match = val.match(/\((.*?)\)/);
                            if (match) comment = match[1].trim();
                        }
                    } else {
                        if (upperVal.startsWith('0')) {
                            isNC = true;
                            const match = val.match(/\((.*?)\)/);
                            if (match) comment = match[1].trim();
                        }
                    }
                    if (isNC) {
                        if (!map.has(tagName)) map.set(tagName, { count: 0, reasonsMap: new Map() });
                        const entry = map.get(tagName);
                        entry.count++;
                        if (comment) {
                            const cleanComment = comment.charAt(0).toUpperCase() + comment.slice(1).toLowerCase();
                            entry.reasonsMap.set(cleanComment, (entry.reasonsMap.get(cleanComment) || 0) + 1);
                        }
                    }
                });
            });

            const result = [];
            map.forEach((value, key) => {
                const sortedReasons = Array.from(value.reasonsMap.entries())
                    .sort((a, b) => b[1] - a[1])
                    .map(([reason, count]) => `${reason} (${count})`);
                result.push({ tagName: key, totalNC: value.count, reasons: sortedReasons });
            });
            return result.sort((a, b) => b.totalNC - a.totalNC).slice(0, 5);
        };

        const aggregateStats = (data, agencyName, callDataRaw) => {
            const filtered = data.filter(d => d.agency === agencyName);
            let callStats = undefined;
            if (callDataRaw && callDataRaw.length > 0) {
                const normalizedCalls = normalizeCallData(callDataRaw, agencyName);
                if (normalizedCalls.length > 0) callStats = normalizedCalls[0];
            }

            const stats = {
                agencyName, totalInterventions: 0, callStats, 
                byContact: { withContact: 0, withoutContact: 0 }, byInstallType: {},
                techSansContactStats: [], totalSansContact: 0, nbTechsWithSansContact: 0,
                techNcStats: [], totalNC: 0, nbTechsWithNc: 0, ncSansContactDetails: [],
                correctionStats: [], totalCorrections: 0, nbTechsWithCorrection: 0, ignoredLines: []
            };

            const ignoredStatsMap = new Map();
            const techMap = new Map();
            const installTypeMap = new Map();
            const correctionMap = new Map();

            filtered.forEach(item => {
                if (item.isIgnored) {
                    if (!ignoredStatsMap.has(item.validator)) ignoredStatsMap.set(item.validator, { validator: item.validator, tagAbsent: 0, tagMisplaced: 0, emptyLine: 0, total: 0 });
                    const stat = ignoredStatsMap.get(item.validator);
                    stat.total++;
                    if (item.ignoreReason === 'EMPTY') stat.emptyLine++; else if (item.ignoreReason === 'TAG_ABSENT') stat.tagAbsent++; else if (item.ignoreReason === 'TAG_MISPLACED') stat.tagMisplaced++;
                    return;
                }
                stats.totalInterventions++;
                if (item.contactStatus === 'Avec Contact') stats.byContact.withContact++; else stats.byContact.withoutContact++;

                if (!installTypeMap.has(item.installType)) installTypeMap.set(item.installType, { with: 0, without: 0, total: 0 });
                const typeStat = installTypeMap.get(item.installType);
                typeStat.total++;
                if (item.contactStatus === 'Avec Contact') typeStat.with++; else typeStat.without++;

                if (!techMap.has(item.technician)) techMap.set(item.technician, { total: 0, sansContact: 0, nc: 0, sansContactNc: 0, sansContactOk: 0, ncReasons: new Set(), correction: 0 });
                const tStat = techMap.get(item.technician);
                tStat.total++;

                if (item.contactStatus === 'Sans Contact') { tStat.sansContact++; stats.totalSansContact++; }

                const isStrictNC = item.validationStatus.includes('NC') || item.validationStatus.includes('KO');
                if (isStrictNC) { tStat.nc++; stats.totalNC++; }

                const isOk = item.validationStatus.includes('CONF') || item.validationStatus.includes('COR');
                if (item.contactStatus === 'Sans Contact') {
                    if (isStrictNC) { tStat.sansContactNc++; if (item.ncReason) tStat.ncReasons.add(item.ncReason); }
                    else if (isOk) tStat.sansContactOk++;
                }

                const isCorPnd = item.validationStatus.includes('COR PND');
                const isCorApr = item.validationStatus.includes('COR APR');
                if (isCorPnd || isCorApr) {
                    stats.totalCorrections++; tStat.correction++; 
                    if (!correctionMap.has(item.installType)) correctionMap.set(item.installType, { pnd: 0, pndReasons: new Set(), apr: 0, aprReasons: new Set() });
                    const cStat = correctionMap.get(item.installType);
                    const reason = item.ncReason || 'Inconnu';
                    if (isCorPnd) { cStat.pnd++; if (reason) cStat.pndReasons.add(reason); }
                    if (isCorApr) { cStat.apr++; if (reason) cStat.aprReasons.add(reason); }
                }
            });

            stats.byInstallType = Object.fromEntries(installTypeMap);
            const techValues = Array.from(techMap.values());
            stats.nbTechsWithCorrection = techValues.filter(t => t.correction > 0).length;
            stats.nbTechsWithNc = techValues.filter(t => t.nc > 0).length;
            stats.nbTechsWithSansContact = techValues.filter(t => t.sansContact > 0).length;
            
            stats.techSansContactStats = Array.from(techMap.entries()).filter(([_, val]) => val.sansContact > 0).map(([tech, val]) => ({
                tech, totalInterventions: val.total, targetCount: val.sansContact,
                individualRate: (val.sansContact / val.total) * 100, globalRate: stats.totalSansContact > 0 ? (val.sansContact / stats.totalSansContact) * 100 : 0
            })).sort((a, b) => b.targetCount - a.targetCount).slice(0, 10); 

            stats.techNcStats = Array.from(techMap.entries()).filter(([_, val]) => val.nc > 0).map(([tech, val]) => ({
                tech, totalInterventions: val.total, targetCount: val.nc,
                individualRate: (val.nc / val.total) * 100, globalRate: stats.totalNC > 0 ? (val.nc / stats.totalNC) * 100 : 0
            })).sort((a, b) => b.targetCount - a.targetCount).slice(0, 10);

            stats.ncSansContactDetails = Array.from(techMap.entries()).filter(([_, val]) => val.sansContact > 0).map(([tech, val]) => {
                const totalSubset = val.sansContact; 
                return {
                    tech, countNC: val.sansContactNc, rateNC: totalSubset > 0 ? (val.sansContactNc / totalSubset) * 100 : 0,
                    topReasons: Array.from(val.ncReasons), countOK: val.sansContactOk, rateOK: totalSubset > 0 ? (val.sansContactOk / totalSubset) * 100 : 0, total: totalSubset
                };
            }).sort((a, b) => b.total - a.total);

            stats.correctionStats = Array.from(correctionMap.entries()).map(([type, val]) => ({
                installType: type, countPnd: val.pnd, motifsPnd: Array.from(val.pndReasons), countApr: val.apr, motifsApr: Array.from(val.aprReasons), totalCor: val.pnd + val.apr
            })).sort((a, b) => b.totalCor - a.totalCor);

            stats.ignoredLines = Array.from(ignoredStatsMap.values()).sort((a, b) => b.total - a.total);

            return stats;
        };

        // --- COMPONENTS ---

        const FileUpload = ({ onFileSelect, isLoading }) => {

                    ) : (
                      <><div className="bg-blue-100/50 p-4 rounded-full mb-6 group-hover:scale-110 transition-transform duration-300"><UploadCloud className="w-12 h-12 text-blue-600" /></div><h3 className="text-2xl font-bold text-slate-800 mb-2">Glissez votre fichier ici</h3><p className="text-slate-500 mb-8 max-w-sm mx-auto">Ou cliquez pour parcourir vos dossiers. Supporte Excel (.xlsx) et CSV.</p><div className="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-lg text-xs font-semibold text-slate-600 uppercase tracking-wide"><FileSpreadsheet className="w-4 h-4" /> Extraction Interventions</div></>

        const AnalysisTable = ({ title, headers, rows, footer }) => (
            <div className="w-full flex flex-col rounded-xl border border-slate-200 overflow-hidden bg-white shadow-sm">

                            )}
                            {activeTab === 'render' && (

                                    <div className="bg-purple-50 p-4 rounded-lg border border-purple-200 flex justify-between items-start"><div><h3 className="text-purple-900 font-bold flex items-center gap-2"><Monitor size={18}/> Diagnostic de Rendu (Screenshot)</h3><p className="text-sm text-purple-700 mt-1">Copiez ces informations et envoyez-les au développeur pour corriger les problèmes de décalage d'image.</p></div><button onClick={handleCopyDiagnostics} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-purple-700"><Clipboard size={16}/> Copier le rapport</button></div>

            const [showDebug, setShowDebug] = useState(false);
            const [visualDiagnostics, setVisualDiagnostics] = useState(null);

            const stats = useMemo(() => aggregateStats(data, selectedAgency, callData || []), [data, callData, selectedAgency]);
            const globalPerf = useMemo(() => calculateGlobalValidatorStats(data), [data]);
            const globalIgnored = useMemo(() => calculateGlobalIgnoredStats(data), [data]);
            const topTagsNC = useMemo(() => calculateGlobalTagNCs(data, selectedAgency), [data, selectedAgency]);

            const totalGlobal = stats.totalInterventions || 1; 
            const periodLabel = useMemo(() => getPeriodLabel(data.filter(d => d.agency === selectedAgency)), [data, selectedAgency]);

            const maxSansContactCount = Math.max(...Object.values(stats.byInstallType).map(v => v.without), 1);
            const maxGlobalRateSansContact = Math.max(...stats.techSansContactStats.map(i => i.globalRate), 0.1);
            const maxGlobalRateNc = Math.max(...stats.techNcStats.map(i => i.globalRate), 0.1);
            const percentSansContact = ((stats.byContact.withoutContact / totalGlobal) * 100).toFixed(1);
            const percentNC = ((stats.totalNC / totalGlobal) * 100).toFixed(1); 
            const qualityService = (100 - (stats.totalNC / totalGlobal * 100)).toFixed(2);

            // ... Helper components for Dashboard ...

                return (

            };

            const formatSeconds = (seconds) => {
                const h = Math.floor(seconds / 3600);

                                    <div className="space-y-6"><div className="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-col h-auto min-h-[300px]"><div className="flex items-center justify-between mb-6"><h3 className="font-bold text-slate-800 flex items-center gap-2"><BarChart2 className="text-emerald-500" size={20}/> Répartition par Type d'Installation</h3><div className="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">Total: {stats.totalInterventions}</div></div><div className="flex-1 w-full"><StackedHorizontalBarChart data={chartStackedData} /></div></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-6"><div className="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-col h-auto min-h-[350px]"><div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-100"><h3 className="font-bold text-slate-800 text-sm flex items-center gap-2"><Phone size={16} className="text-orange-500" /> Top 10 : Sans Contact</h3></div><div className="flex-1">{stats.techSansContactStats.length > 0 ? stats.techSansContactStats.map((tech, idx) => <HorizontalBarRow key={tech.tech} rank={idx + 1} label={tech.tech} value={tech.targetCount} max={stats.techSansContactStats[0]?.targetCount || 0} colorClass="bg-orange-400" shadowClass="shadow-none" />) : <p className="text-slate-400 text-sm text-center py-10">Aucune donnée disponible</p>}</div></div><div className="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-col h-auto min-h-[350px]"><div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-100"><h3 className="font-bold text-slate-800 text-sm flex items-center gap-2"><AlertTriangle size={16} className="text-red-500" /> Top 10 : Non-Conformités (NC)</h3></div><div className="flex-1">{stats.techNcStats.length > 0 ? stats.techNcStats.map((tech, idx) => <HorizontalBarRow key={tech.tech} rank={idx + 1} label={tech.tech} value={tech.targetCount} max={stats.techNcStats[0]?.targetCount || 0} colorClass="bg-red-500" shadowClass="shadow-[0_0_10px_rgba(239,68,68,0.3)]" />) : <p className="text-slate-400 text-sm text-center py-10">Aucune NC détectée</p>}</div></div></div></div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden mt-6"><div className="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between"><h3 className="font-bold text-slate-800 flex items-center gap-2"><CheckCircle size={18} className="text-slate-500"/> Détails NC détectées sur 'Sans Contact'</h3><div className="flex items-center gap-2 text-sm text-red-600 bg-red-50 px-3 py-1 rounded-full font-medium border border-red-100"><AlertTriangle size={14} /> {stats.ncSansContactDetails.reduce((acc, curr) => acc + curr.countNC, 0)} NC à traiter</div></div><div className="p-0"><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200"><tr><th className="px-6 py-3">Technicien</th><th className="px-6 py-3">NC (Taux)</th><th className="px-6 py-3">Motifs Principaux</th><th className="px-6 py-3">OK (Taux)</th><th className="px-6 py-3">Total Sans Contact</th></tr></thead><tbody className="divide-y divide-slate-100">{stats.ncSansContactDetails.slice(0, 10).map((row, idx) => <tr key={idx} className="hover:bg-slate-50/50"><td className="px-6 py-3 font-medium text-slate-900">{row.tech}</td><td className="px-6 py-3"><span className="text-red-600 font-bold bg-red-50 px-2 py-1 rounded border border-red-100">{row.countNC} <span className="text-xs font-normal text-red-400">({row.rateNC.toFixed(1)}%)</span></span></td><td className="px-6 py-3 text-slate-500 italic truncate max-w-xs">{row.topReasons.join(', ') || '-'}</td><td className="px-6 py-3"><span className="text-slate-700">{row.countOK} <span className="text-xs text-slate-400">({row.rateOK.toFixed(1)}%)</span></span></td><td className="px-6 py-3 font-bold text-slate-800">{row.total}</td></tr>)}{stats.ncSansContactDetails.length === 0 && <tr><td colSpan={5} className="p-6 text-center text-slate-400">Aucune donnée disponible</td></tr>}</tbody></table></div></div></div>

        function App() {
            const [interventionData, setInterventionData] = useState(null);

            const [isLoadingCall, setIsLoadingCall] = useState(false);

            const [selectedAgency, setSelectedAgency] = useState('');

            const agencies = useMemo(() => {
                if (!interventionData) return [];
                return Array.from(new Set(interventionData.map(i => i.agency))).sort();
            }, [interventionData]);

            useEffect(() => {
                if (agencies.length > 0 && !selectedAgency) setSelectedAgency(agencies[0]);
            }, [agencies, selectedAgency]);

            const handleInterventionFile = async (file) => {
                setIsLoadingInt(true); setError(null);
                try {
                    const rawData = await parseFile(file);
                    const normalized = normalizeData(rawData);
                    if (normalized.length === 0) setError("Le fichier interventions semble vide ou invalide.");
                    else { setInterventionData(normalized); setSelectedAgency(''); }
                } catch (err) { console.error(err); setError("Erreur lecture fichier Interventions."); } finally { setIsLoadingInt(false); }
            };

            const handleCallFile = async (file) => {
                setIsLoadingCall(true); setError(null);
                try { const rawData = await parseFile(file); setCallData(rawData); } catch (err) { console.error(err); setError("Erreur lecture fichier Appels (optionnel)."); } finally { setIsLoadingCall(false); }
            };

            const handleExport = () => {
                if (!interventionData || !selectedAgency) return;
                const filteredData = interventionData.filter(i => i.agency === selectedAgency);
                const exportData = filteredData.map(item => ({ ...item.originalRow, ...item.extractedFields }));
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Extraction_Vigie");
                XLSX.writeFile(workbook, `Vigie_S${filteredData[0]?.week || 0}_${selectedAgency}.xlsx`);
            };

            const handleExportGlobal = () => {
                if (!interventionData) return;
                const exportData = interventionData.map(item => ({ ...item.originalRow, ...item.extractedFields }));
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Extraction_Globale");
                const week = interventionData[0]?.week || 0;
                XLSX.writeFile(workbook, `Vigie_S${week}_GLOBAL.xlsx`);
            };

            const reset = () => { setInterventionData(null); setCallData(null); setError(null); setSelectedAgency(''); };
            const showDashboard = interventionData !== null;

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-emerald-100 selection:text-emerald-900">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-20">
                                <div className="flex items-center gap-3 shrink-0">
                                    <div className="bg-slate-800 p-2 rounded-lg shadow-sm cursor-pointer hover:bg-slate-700 transition-colors" onClick={reset}><LayoutDashboard className="h-6 w-6 text-white" /></div>
                                    <div className="flex flex-col mr-6"><span className="font-extrabold text-xl tracking-tight text-slate-800 leading-none">Vigie<span className="text-emerald-600">VCR</span></span><span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-0.5">RACC BYTEL</span></div>
                                </div>
                                {showDashboard && (
                                    <div className="flex-1 flex items-center justify-center gap-4 overflow-x-auto px-4 scrollbar-none">
                                        <div className="flex items-center gap-2 p-1 bg-slate-100 rounded-xl border border-slate-200">{agencies.map(agency => {
                                            const color = getAgencyColor(agency); const isSelected = selectedAgency === agency;
                                            return <button key={agency} onClick={() => setSelectedAgency(agency)} style={{ backgroundColor: isSelected ? color : '#ffffff', color: isSelected ? '#ffffff' : color, borderColor: color }} className={`px-5 py-2 rounded-lg text-sm font-bold border-2 transition-all duration-200 whitespace-nowrap ${isSelected ? 'shadow-md scale-105' : 'hover:bg-slate-50 opacity-70 hover:opacity-100 hover:scale-105'}`}>{agency}</button>;
                                        })}</div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={handleExport} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-sm text-sm font-medium transition-all whitespace-nowrap" title="Export Agence Sélectionnée"><Download size={16} /> <span className="hidden lg:inline">Export {selectedAgency}</span></button>
                                            <button onClick={handleExportGlobal} className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg shadow-sm text-sm font-medium transition-all whitespace-nowrap" title="Export Global (Toutes Agences)"><FileSpreadsheet size={16} /> <span className="hidden lg:inline">Export Global</span></button>
                                        </div>
                                    </div>
                                )}
                                <div className="flex items-center gap-4 shrink-0">
                                    <HeaderUploadButton label="Interventions" subLabel="TecNow" icon={<FileSpreadsheet className="w-4 h-4" />} isLoading={isLoadingInt} isLoaded={!!interventionData} theme="tecnow" onFileSelect={handleInterventionFile} />
                                    <div className="h-8 w-px bg-slate-200 hidden sm:block"></div>
                                    <HeaderUploadButton label="Appels" subLabel="Genesys" icon={<PhoneIncoming className="w-4 h-4" />} isLoading={isLoadingCall} isLoaded={!!callData} theme="genesys" onFileSelect={handleCallFile} />
                                </div>
                            </div>
                        </div>
                    </nav>
                    <main className="py-8 px-4 sm:px-6">
                        {error && (<div className="max-w-7xl mx-auto mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-start gap-3 shadow-sm animate-in slide-in-from-top-2"><div className="mt-0.5"><AlertTriangle className="w-5 h-5" /></div><div><p className="font-bold">Erreur de chargement</p><p className="text-sm opacity-90">{error}</p></div><button onClick={() => setError(null)} className="ml-auto text-red-400 hover:text-red-600">✕</button></div>)}
                        {!showDashboard ? (
                            <div className="max-w-5xl mx-auto animate-in fade-in duration-500">
                                <div className="text-center mb-16 mt-12"><div className="inline-flex items-center justify-center p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-6"><Database className="w-8 h-8 text-slate-400" /></div><h1 className="text-4xl md:text-5xl font-extrabold text-slate-900 mb-6 tracking-tight">Analyse & Validation <span className="text-emerald-600">Centralisée</span></h1><p className="text-lg text-slate-600 max-w-2xl mx-auto leading-relaxed">Consolidez vos données <strong>TecNow</strong> et <strong>Genesys</strong> en un seul tableau de bord interactif pour piloter la performance de vos agences.</p></div>
                                <div className="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"><FeatureCard icon={<FileUp className="text-blue-500"/>} title="Import Multi-Sources" desc="Compatible avec les exports TecNow (ServiceNow) et les statistiques de files d'attente Genesys." /><FeatureCard icon={<ShieldCheck className="text-emerald-500" />} title="Audit Qualité TecNow" desc="Détection automatique des NC déclarées (Sans Contact) et analyse des motifs de rejet." /><FeatureCard icon={<PhoneIncoming className="text-orange-500" />} title="KPIs Genesys" desc="Visualisation immédiate de la QS, QS Nette, DMR et abandons par file." /></div>
                            </div>
                        ) : <Dashboard data={interventionData} callData={callData} selectedAgency={selectedAgency} onBack={reset} />}
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
